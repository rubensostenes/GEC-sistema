{% extends "base.html" %}
{% block titulo %}Redefinir senha{% endblock %}
{% block conteudo %}

<div class="topo-pagina">
  <h1>Redefinir senha de {{ usuario.nome }}</h1>
</div>

<form method="post" class="painel" style="max-width:420px;">
  <div class="campo">
    <label for="nova_senha">Nova senha (mín. 6 caracteres)</label>
    <input type="password" id="nova_senha" name="nova_senha" required minlength="6">
  </div>
  <div class="campo">
    <label for="confirmar_senha">Confirmar nova senha</label>
    <input type="password" id="confirmar_senha" name="confirmar_senha" required minlength="6">
  </div>
  <div class="acoes-form">
    <button type="submit" class="btn btn-primario">Redefinir senha</button>
    <a href="{{ url_for('cadastros.usuarios') }}" class="btn btn-secundario">Cancelar</a>
  </div>
</form>

{% endblock %}
