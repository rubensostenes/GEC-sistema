{% extends "base.html" %}
{% block titulo %}Nova Unidade{% endblock %}
{% block conteudo %}

<div class="nv-janela" style="margin-bottom:12px;">
  <div class="nv-janela-titulo">🏥 Nova Unidade</div>
</div>

<form method="post" class="nv-form" style="max-width:560px;">
  <div class="nv-form-grid">
    <div class="campo">
      <label for="nome">Nome da unidade</label>
      <input type="text" id="nome" name="nome" required placeholder="Ex: Iputinga, Boa Vista, Jaboatão...">
    </div>
    <div class="campo">
      <label for="endereco">Endereço</label>
      <input type="text" id="endereco" name="endereco">
    </div>
  </div>
  <div class="acoes-form" style="padding:10px 12px 0;">
    <button type="submit" class="btn btn-primario">Salvar</button>
    <a href="{{ url_for('cadastros.unidades') }}" class="btn btn-secundario">Cancelar</a>
  </div>
</form>

{% endblock %}
