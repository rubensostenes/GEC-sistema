{% extends "base.html" %}
{% block titulo %}Novo Transporte{% endblock %}
{% block conteudo %}

<div class="nv-janela" style="margin-bottom:12px;">
  <div class="nv-janela-titulo">🚚 Novo Transporte de Equipamento</div>
</div>

<form method="post" class="nv-form">
  <div class="nv-form-grid">
    <div class="campo span-2">
      <label for="equipamento_id">Equipamento</label>
      <select id="equipamento_id" name="equipamento_id" required>
        {% for e in equipamentos %}
        <option value="{{ e.id }}">{{ e.nome }}{% if e.patrimonio %} ({{ e.patrimonio }}){% endif %}</option>
        {% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="origem">Origem</label>
      <input type="text" id="origem" name="origem">
    </div>
    <div class="campo">
      <label for="destino">Destino</label>
      <input type="text" id="destino" name="destino" required>
    </div>
    <div class="campo">
      <label for="data_transporte">Data</label>
      <input type="date" id="data_transporte" name="data_transporte" required>
    </div>
    <div class="campo">
      <label for="responsavel">Responsável pelo transporte</label>
      <input type="text" id="responsavel" name="responsavel">
    </div>
    <div class="campo span-2 alinhar-topo">
      <label for="observacao">Observação</label>
      <textarea id="observacao" name="observacao"></textarea>
    </div>
  </div>
  <div class="acoes-form" style="padding:10px 12px 0;">
    <button type="submit" class="btn btn-primario">Registrar transporte</button>
    <a href="{{ url_for('ativos.transportes') }}" class="btn btn-secundario">Cancelar</a>
  </div>
</form>

{% endblock %}
