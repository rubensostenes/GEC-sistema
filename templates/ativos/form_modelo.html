{% extends "base.html" %}
{% block titulo %}Novo Modelo{% endblock %}
{% block conteudo %}

<div class="nv-janela" style="margin-bottom:12px;">
  <div class="nv-janela-titulo">🏷 Novo Modelo</div>
</div>

<form method="post" class="nv-form" style="max-width:560px;">
  <div class="nv-form-grid">
    <div class="campo">
      <label for="nome">Nome do modelo</label>
      <input type="text" id="nome" name="nome" required>
    </div>
    <div class="campo">
      <label for="fabricante_id">Fabricante</label>
      <select id="fabricante_id" name="fabricante_id">
        <option value="">—</option>
        {% for f in fabricantes %}
        <option value="{{ f.id }}">{{ f.nome }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="categoria">Categoria</label>
      <input type="text" id="categoria" name="categoria">
    </div>
    <div class="campo span-2">
      <label class="checkbox">
        <input type="checkbox" name="padrao_preferencial">
        Modelo padrão preferencial da instituição
      </label>
    </div>
  </div>
  <div class="acoes-form" style="padding:10px 12px 0;">
    <button type="submit" class="btn btn-primario">Salvar</button>
    <a href="{{ url_for('ativos.modelos') }}" class="btn btn-secundario">Cancelar</a>
  </div>
</form>

{% endblock %}
