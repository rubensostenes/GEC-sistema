{% extends "base.html" %}
{% block titulo %}Nova Baixa{% endblock %}
{% block conteudo %}

<div class="nv-janela" style="margin-bottom:12px;">
  <div class="nv-janela-titulo">📤 Nova Baixa de Estoque</div>
</div>

<form method="post" class="nv-form">
  <div class="nv-form-grid">
    <div class="campo span-2">
      <label for="peca_id">Peça</label>
      <select id="peca_id" name="peca_id" required>
        {% for p in pecas %}
        <option value="{{ p.id }}">{{ p.nome }} (estoque: {{ p.quantidade }} {{ p.unidade_medida }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="quantidade">Quantidade</label>
      <input type="number" step="0.01" id="quantidade" name="quantidade" required value="1">
    </div>
    <div class="campo span-2">
      <label for="motivo">Motivo</label>
      <input type="text" id="motivo" name="motivo" required placeholder="Ex: Peça danificada, vencida, extraviada">
    </div>
  </div>
  <div class="acoes-form" style="padding:10px 12px 0;">
    <button type="submit" class="btn btn-primario">Registrar baixa</button>
    <a href="{{ url_for('estoque.baixas') }}" class="btn btn-secundario">Cancelar</a>
  </div>
</form>

{% endblock %}
