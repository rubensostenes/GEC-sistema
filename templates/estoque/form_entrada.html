{% extends "base.html" %}
{% block titulo %}Nova Entrada{% endblock %}
{% block conteudo %}

<div class="nv-janela" style="margin-bottom:12px;">
  <div class="nv-janela-titulo">📥 Nova Entrada / Nota Fiscal</div>
</div>

<form method="post" class="nv-form">
  <div class="nv-form-grid">
    <div class="campo">
      <label for="numero_nota">Número da nota fiscal</label>
      <input type="text" id="numero_nota" name="numero_nota">
    </div>
    <div class="campo">
      <label for="fornecedor_id">Fornecedor</label>
      <select id="fornecedor_id" name="fornecedor_id">
        <option value="">—</option>
        {% for f in fornecedores %}
        <option value="{{ f.id }}">{{ f.nome }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="campo span-2 alinhar-topo">
      <label for="observacao">Observação</label>
      <textarea id="observacao" name="observacao"></textarea>
    </div>
  </div>
  <p class="texto-mudo texto-pequeno" style="padding:0 12px;">Depois de criar a entrada, adicione os itens recebidos — o estoque é atualizado automaticamente.</p>
  <div class="acoes-form" style="padding:10px 12px 0;">
    <button type="submit" class="btn btn-primario">Criar entrada</button>
    <a href="{{ url_for('estoque.entradas') }}" class="btn btn-secundario">Cancelar</a>
  </div>
</form>

{% endblock %}
