{% extends "base.html" %}
{% block titulo %}Novo Pedido de Compra{% endblock %}
{% block conteudo %}

<div class="nv-janela" style="margin-bottom:12px;">
  <div class="nv-janela-titulo">📦 Novo Pedido de Compra</div>
</div>

<form method="post" class="nv-form" style="max-width:560px;">
  <div class="nv-form-grid">
    <div class="campo">
      <label for="fornecedor_id">Fornecedor</label>
      <select id="fornecedor_id" name="fornecedor_id">
        <option value="">—</option>
        {% for f in fornecedores %}
        <option value="{{ f.id }}">{{ f.nome }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="campo alinhar-topo">
      <label for="observacao">Observação</label>
      <textarea id="observacao" name="observacao"></textarea>
    </div>
  </div>
  <p class="texto-mudo texto-pequeno" style="padding:0 12px;">Depois de criar o pedido, você adiciona os itens na tela seguinte.</p>
  <div class="acoes-form" style="padding:10px 12px 0;">
    <button type="submit" class="btn btn-primario">Criar pedido</button>
    <a href="{{ url_for('estoque.pedidos') }}" class="btn btn-secundario">Cancelar</a>
  </div>
</form>

{% endblock %}
