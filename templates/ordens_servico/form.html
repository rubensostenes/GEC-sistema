{% extends "base.html" %}
{% block titulo %}Nova Ordem de Serviço{% endblock %}
{% block conteudo %}

<div class="nv-janela" style="margin-bottom:12px;">
  <div class="nv-janela-titulo">🛠 Abrir Ordem de Serviço</div>
</div>

<form method="post" class="nv-form">
  <div class="nv-form-secao">
    <div class="nv-form-secao-titulo">Dados da solicitação</div>
  </div>
  <div class="nv-form-grid">
    <div class="campo span-2">
      <label for="equipamento_id">Equipamento</label>
      <select id="equipamento_id" name="equipamento_id">
        <option value="">— Não vinculado a um equipamento —</option>
        {% for e in equipamentos %}
        <option value="{{ e.id }}" {{ 'selected' if equipamento_id_preselecionado|string == e.id|string }}>{{ e.nome }}{% if e.patrimonio %} ({{ e.patrimonio }}){% endif %}</option>
        {% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="tipo">Tipo de serviço</label>
      <select id="tipo" name="tipo">
        {% for k, v in tipo_labels.items() %}
        <option value="{{ k }}" {{ 'selected' if k == 'corretiva' }}>{{ v }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="prioridade">Prioridade</label>
      <select id="prioridade" name="prioridade">
        {% for k, v in prioridade_labels.items() %}
        <option value="{{ k }}" {{ 'selected' if k == 'media' }}>{{ v }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="solicitante">Solicitante</label>
      <input type="text" id="solicitante" name="solicitante" placeholder="Nome de quem solicitou">
    </div>
    <div class="campo">
      <label for="tecnico_id">Técnico responsável</label>
      <select id="tecnico_id" name="tecnico_id">
        <option value="">— A definir —</option>
        {% for t in tecnicos %}
        <option value="{{ t.id }}">{{ t.nome }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="data_agendada">Data agendada</label>
      <input type="date" id="data_agendada" name="data_agendada">
    </div>
    <div class="campo span-2 alinhar-topo">
      <label for="descricao_problema">Descrição do problema</label>
      <textarea id="descricao_problema" name="descricao_problema" required placeholder="Descreva o defeito relatado ou o serviço a ser realizado"></textarea>
    </div>
  </div>

  <div class="nv-form-secao">
    <div class="nv-form-secao-titulo">Custos e classificação (opcional)</div>
  </div>
  <div class="nv-form-grid">
    <div class="campo">
      <label for="centro_custo_id">Centro de custo</label>
      <select id="centro_custo_id" name="centro_custo_id">
        <option value="">—</option>
        {% for c in centros_custo %}
        <option value="{{ c.id }}">{{ c.nome }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="label_id">Label</label>
      <select id="label_id" name="label_id">
        <option value="">—</option>
        {% for l in labels %}
        <option value="{{ l.id }}">{{ l.nome }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="nv-form-secao">
    <div class="nv-form-secao-titulo">Serviço externo (opcional)</div>
  </div>
  <div class="nv-form-grid">
    <div class="campo">
      <label for="empresa_terceirizada">Empresa terceirizada</label>
      <input type="text" id="empresa_terceirizada" name="empresa_terceirizada">
    </div>
    <div class="campo">
      <label for="valor_orcamento">Valor do orçamento (R$)</label>
      <input type="number" step="0.01" id="valor_orcamento" name="valor_orcamento">
    </div>
    <div class="campo span-2">
      <label class="checkbox">
        <input type="checkbox" name="aguardando_aprovacao_orcamento">
        Aguardando aprovação do orçamento antes de iniciar o serviço
      </label>
    </div>
  </div>

  <div class="acoes-form" style="padding:10px 12px 0;">
    <button type="submit" class="btn btn-primario">Abrir Ordem de Serviço</button>
    <a href="{{ url_for('ordens_servico.lista') }}" class="btn btn-secundario">Cancelar</a>
  </div>
</form>

{% endblock %}
