{% extends "base.html" %}
{% block titulo %}Novo Contrato{% endblock %}
{% block conteudo %}

<div class="nv-janela" style="margin-bottom:12px;">
  <div class="nv-janela-titulo">📄 Novo Contrato de Manutenção</div>
</div>

<form method="post" class="nv-form">
  <div class="nv-form-grid">
    <div class="campo span-2">
      <label for="descricao">Descrição</label>
      <input type="text" id="descricao" name="descricao" required placeholder="Ex: Manutenção preventiva anual dos facoemulsificadores">
    </div>
    <div class="campo">
      <label for="tipo_servico">Tipo de serviço</label>
      <input type="text" id="tipo_servico" name="tipo_servico" placeholder="Ex: Preventiva, Calibração, Suporte">
    </div>
    <div class="campo">
      <label for="fornecedor_id">Fornecedor</label>
      <select id="fornecedor_id" name="fornecedor_id">
        <option value="">—</option>
        {% for f in fornecedores %}
        <option value="{{ f.id }}">{{ f.nome }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="unidade_id">Unidade (se aplicável a toda a unidade)</label>
      <select id="unidade_id" name="unidade_id">
        <option value="">—</option>
        {% for u in unidades %}
        <option value="{{ u.id }}">{{ u.nome }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="equipamento_id">Equipamento (se específico)</label>
      <select id="equipamento_id" name="equipamento_id">
        <option value="">—</option>
        {% for e in equipamentos %}
        <option value="{{ e.id }}">{{ e.nome }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="data_inicio">Início da vigência</label>
      <input type="date" id="data_inicio" name="data_inicio">
    </div>
    <div class="campo">
      <label for="data_fim">Fim da vigência</label>
      <input type="date" id="data_fim" name="data_fim">
    </div>
    <div class="campo">
      <label for="valor">Valor (R$)</label>
      <input type="number" step="0.01" id="valor" name="valor">
    </div>
    <div class="campo span-2 alinhar-topo">
      <label for="observacoes">Observações</label>
      <textarea id="observacoes" name="observacoes"></textarea>
    </div>
  </div>
  <div class="acoes-form" style="padding:10px 12px 0;">
    <button type="submit" class="btn btn-primario">Salvar contrato</button>
    <a href="{{ url_for('gestao.contratos') }}" class="btn btn-secundario">Cancelar</a>
  </div>
</form>

{% endblock %}
