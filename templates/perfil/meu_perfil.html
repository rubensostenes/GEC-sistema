{% extends "base.html" %}
{% block titulo %}Meu Perfil{% endblock %}
{% block conteudo %}

<div class="topo-pagina">
  <h1>Meu Perfil</h1>
</div>

<div class="grid-2col">
  <div class="painel">
    <h2>Dados pessoais</h2>
    <form method="post">
      <div class="form-grid">
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" value="{{ usuario.nome }}" required>
        </div>
        <div class="campo">
          <label>E-mail</label>
          <input type="email" value="{{ usuario.email }}" disabled>
          <span class="ajuda">O e-mail não pode ser alterado. Fale com um administrador se precisar mudá-lo.</span>
        </div>
        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" name="telefone" value="{{ usuario.telefone or '' }}">
        </div>
        <div class="campo">
          <label>Cargo</label>
          <input type="text" value="{{ usuario.cargo }}" disabled>
        </div>
      </div>
      <div class="acoes-form">
        <button type="submit" class="btn btn-primario">Salvar</button>
      </div>
    </form>
  </div>

  <div class="painel">
    <h2>Alterar senha</h2>
    <form method="post" action="{{ url_for('perfil.trocar_senha') }}">
      <div class="campo">
        <label for="senha_atual">Senha atual</label>
        <input type="password" id="senha_atual" name="senha_atual" required>
      </div>
      <div class="campo" style="margin-top:10px;">
        <label for="nova_senha">Nova senha</label>
        <input type="password" id="nova_senha" name="nova_senha" required minlength="6">
      </div>
      <div class="campo" style="margin-top:10px;">
        <label for="confirmar_senha">Confirmar nova senha</label>
        <input type="password" id="confirmar_senha" name="confirmar_senha" required minlength="6">
      </div>
      <div class="acoes-form">
        <button type="submit" class="btn btn-primario">Alterar senha</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
